<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vire</title>
    <meta
      name="description"
      content="A minimal guitar and ukulele tuner. Runs in your browser; audio never leaves your device."
    />

    <!-- Home-screen launch: fullscreen, no browser chrome. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vire" />
    <!--
      Home-screen app draws under the status bar, so the in-tune green fills the whole screen
      (iOS 26 only samples its own bar colour at launch). Trade-off: iOS shows the clock in white.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Kept in sync with the screen background by the app (moon grey when in tune). -->
    <meta name="theme-color" content="#F8F5EE" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
